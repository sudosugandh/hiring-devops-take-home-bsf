name: bsf-stack

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wpuser
  WORDPRESS_DB_PASSWORD: wp-db-pass-2026
  WORDPRESS_TABLE_PREFIX: wp_
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', 'https://localhost:8443');
    define('WP_SITEURL', 'https://localhost:8443');
    define('FORCE_SSL_ADMIN', true);
    define('WP_REDIS_HOST', 'redis');
    define('WP_REDIS_PORT', 6379);
    define('WP_REDIS_PASSWORD', 'bsf-redis-cache-2026');
    define('WP_REDIS_GRACEFUL', true);
    define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
    define('WP_DEBUG_DISPLAY', false);

services:
  # "Edge" = what Cloudflare / our load balancer does in production.
  # Terminates TLS and routes to WordPress and the Next.js app.
  edge:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - app1
      - app2
    restart: unless-stopped

  # Web server in front of PHP-FPM (one per WordPress server in production).
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_data:/var/www/html:ro
    depends_on:
      - wordpress
    restart: unless-stopped

  wordpress:
    image: wordpress:6.6-php8.3-fpm
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/bsf-shop:/var/www/html/wp-content/plugins/bsf-shop:ro
      - ./php/zz-bsf-pool.conf:/usr/local/etc/php-fpm.d/zz-bsf-pool.conf:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # One-off job: installs WordPress, plugins and demo content. Re-running is safe.
  setup:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/bsf-shop:/var/www/html/wp-content/plugins/bsf-shop:ro
      - ./scripts/setup.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh"]
    depends_on:
      - wordpress
      - db
    restart: "no"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root-pass-2026
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: wp-db-pass-2026
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/conf.d/bsf.cnf:/etc/mysql/conf.d/bsf.cnf:ro
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  # Next.js SaaS app, two instances behind the edge load balancer.
  app1:
    build: ./app
    environment:
      INSTANCE_NAME: app1
      PORT: "3000"
    restart: unless-stopped

  app2:
    build: ./app
    environment:
      INSTANCE_NAME: app2
      # Containers don't share a network namespace, so this does not clash
      # with app1. The edge upstream calls app2:3000.
      PORT: "3000"
    restart: unless-stopped

  # S3-compatible storage standing in for AWS S3.
  s3:
    # Community build of MinIO (upstream no longer publishes images).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bsfadmin
      MINIO_ROOT_PASSWORD: bsf-s3-root-secret
    ports:
      - "9001:9001"
    volumes:
      - s3_data:/data
    restart: unless-stopped

  # Bucket + upload-only user. Backup itself never gets the MinIO root keys.
  s3-init:
    build:
      context: ./backup
      dockerfile: Dockerfile.s3init
    environment:
      MINIO_ROOT_USER: bsfadmin
      MINIO_ROOT_PASSWORD: bsf-s3-root-secret
      BACKUP_ACCESS_KEY: bsf-backup
      BACKUP_SECRET_KEY: bsf-backup-secret-2026
    depends_on:
      - s3
    restart: "no"

  # Nightly backup job. Run manually with: docker compose run --rm backup
  backup:
    build: ./backup
    environment:
      DB_HOST: db
      DB_USER: backup
      DB_PASSWORD: backup-pass-2026
      DB_NAME: wordpress
      AWS_ACCESS_KEY_ID: bsf-backup
      AWS_SECRET_ACCESS_KEY: bsf-backup-secret-2026
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: bsf-backups
      S3_PREFIX: site-x
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    profiles: ["jobs"]

volumes:
  wp_data:
  db_data:
  s3_data:

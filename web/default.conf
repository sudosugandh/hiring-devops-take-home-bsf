# WordPress vhost (Nginx -> PHP-FPM)
# TLS stops at the edge. This vhost is plain HTTP, so pass the scheme through
# or WordPress (FORCE_SSL_ADMIN) will redirect forever.
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   "on";
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    client_max_body_size 32m;

    # setup.sh used to drop a .env full of db credentials in the docroot.
    location ~ /\. {
        deny all;
    }

    location ~* /debug\.log$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        fastcgi_pass wordpress:9000;
        fastcgi_read_timeout 15s;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
